<!-- Página de inicio de sesión -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAcción - Iniciar sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">🌱 EcoAcción</h1>
        <div class="nav-links">
            <a href="{{ url_for('inicio') }}" class="btn-inicio">Inicio</a>
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('registro') }}" class="btn-nav">Registrarse</a>
        </div>
    </nav>

    <section class="form-section">
        <div class="form-card">
            <h2>Iniciar sesión</h2>

            <!-- Mostramos un mensaje de error si los datos no son correctos -->
            {% if error %}
                <p class="mensaje-error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <button type="submit" class="btn-principal">Entrar</button>
            </form>

            <p class="texto-secundario">
                ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
            </p>
        </div>
    </section>

</body>
</html>
