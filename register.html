<!-- Página de registro de nuevos usuarios -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAcción - Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">🌱 EcoAcción</h1>
        <div class="nav-links">
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </div>
    </nav>

    <section class="form-section">
        <div class="form-card">
            <h2>Crear una cuenta</h2>

            <!-- Mostramos un mensaje de error si el correo ya existe -->
            {% if error %}
                <p class="mensaje-error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('registro') }}">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required minlength="4">

                <button type="submit" class="btn-principal">Registrarme</button>
            </form>

            <p class="texto-secundario">
                ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a>
            </p>
        </div>
    </section>

</body>
</html>
